# 服务器配置
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8  # 强制编码（Spring Boot 3.x默认UTF-8，可省略）
      enabled: true

spring:
  jackson:
    time-zone: Asia/Shanghai # 序列化/反序列化时用东八区
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.101:33061/demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root  # 你的数据库用户名
    password: 123456  # 你的数据库密码
    # ===== Druid 连接池专用配置 =====
    druid:
      initial-size: 5    # 连接池初始化大小
      min-idle: 5       # 最小空闲连接数
      max-active: 20       # 最大活跃连接数
      max-wait: 60000      # 获取连接时的最大等待时间（毫秒，超时会抛异常）
      time-between-eviction-runs-millis: 60000      # 连接池的连接空闲后，验证连接是否有效（建议开启）
      min-evictable-idle-time-millis: 300000       # 连接的最小生存时间（毫秒）
      validation-query: SELECT 1 FROM DUAL       # 验证连接是否有效的 SQL 语句（MySQL 用这个，Oracle 可改为 SELECT 1 FROM DUAL）
      test-while-idle: true       # 空闲时验证连接是否有效（生产环境建议开启，保证连接可用性）
      # PSCache 最大缓存数（需与 max-active 匹配）
      max-pool-prepared-statement-per-connection-size: 20
      # 配置扩展插件：监控统计（stat）、日志（log4j2，Spring Boot 3 推荐用 log4j2 替代 log4j）、防SQL注入（wall）
      filters: stat,wall,log4j2
      # 配置过滤器的参数（比如慢SQL阈值：超过500ms记录为慢SQL）
      filter:
        stat:
          # 慢SQL阈值（毫秒）
          slow-sql-millis: 500
          # 记录慢SQL日志
          log-slow-sql: true
          # 合并多个连接的SQL统计
          merge-sql: true
        wall:
          # 开启SQL防火墙（防注入）
          enabled: true
          # 允许的数据库类型（MySQL）
          db-type: mysql
          # 自定义防火墙规则（比如禁止DROP表）
          config:
            drop-table-allow: false

  # Redis配置
  data:
    redis:
      password:
      database: 0
      host: 192.168.1.101
      port: 16379
  # Freemarker配置
  freemarker:
    template-loader-path: classpath:/templates/  # 模板存放目录
    charset: UTF-8
    suffix: .ftl  # 模板后缀
    cache: false   # 开发环境关闭缓存

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true # MyBatis 在使用 resultMap 来映射查询结果中的列，如果查询结果中包含空值的列，则 MyBatis 在映射的时候，不会映射这个字段
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# JWT自定义配置
jwt:
  secret: your-secret-key-1234567890abcdefghijklmnopqrstuvwxyz  # 密钥（生产环境需加密存储）
  expire-time: 3600000  # 令牌过期时间（1小时，单位：毫秒）
  refresh-time: 7200000 # 刷新令牌时间（2小时，可选）
  header: Authorization  # 请求头中令牌的key
  prefix: Bearer         # 令牌前缀（空格分隔）

# Spring Security配置（关闭默认表单登录）
security:
  basic:
    enabled: false

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
