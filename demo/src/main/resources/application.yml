---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://prod-db-host:33061/demo?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:prod_user}
    password: ${DB_PASSWORD:prod_password}
    druid:
      initial-size: 20
      min-idle: 20
      max-active: 100
      max-wait: 10000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,log4j2
      filter:
        stat:
          slow-sql-millis: 2000
          log-slow-sql: true
          merge-sql: true
        wall:
          enabled: true
          db-type: mysql
          config:
            drop-table-allow: false
  data:
    redis:
      password: ${REDIS_PASSWORD}
      database: 0
      host: prod-redis-host
      port: 6379
  freemarker:
    template-loader-path: classpath:/templates/
    charset: UTF-8
    suffix: .ftl
    cache: true

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false

jwt:
  secret: ${JWT_SECRET}
  expire-time: 7200000
  refresh-time: 14400000
  header: Authorization
  prefix: Bearer

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

knife4j:
  enable: false

logging:
  level:
    root: WARN
    com.fxly.demo: INFO


