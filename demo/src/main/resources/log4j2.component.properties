# 异步日志配置
# RingBuffer大小（必须是2的幂）
AsyncLogger.RingBufferSize=262144

# 异步日志等待策略
# Timeout: 睡眠+自旋，适合低延迟场景
# Sleep: 纯睡眠，CPU占用低但延迟高
AsyncLogger.WaitStrategy=Timeout

# 异步日志异常处理器
AsyncLogger.ExceptionHandler=default

# 异步Appender配置
AsyncAppender.RingBufferSize=262144
AsyncAppender.WaitStrategy=Timeout

# 禁用JMX（生产环境推荐）
log4j2.disableJmx=true

# 配置文件热加载
log4j2.configurationFileWatchInterval=30

# 上下文选择器
AsyncLoggerContextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
